name: CI

# Lint + test on every push and pull request; build standalone Linux and
# Windows artifacts when a version tag (v*) is pushed. The build jobs run the
# same "make dist" / "make.ps1 dist" front-doors developers use locally, so CI
# exercises the real packaging path rather than a separate one.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # allow the tagged build to attach files to a Release

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: python -m pip install -r requirements-build.txt
      - name: Ruff check
        run: python -m ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system libraries for headless Qt
        # PySide6 (imported when the test suite loads the gui package) needs
        # these shared libraries even under the offscreen platform plugin.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.label }} artifacts
    # Only build/package on tag pushes (releases).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build toolchain
        run: python -m pip install -r requirements-build.txt

      - name: Build + package (Linux)
        if: runner.os == 'Linux'
        run: make dist

      - name: Build + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1) Build the standalone one-folder binary + release zip.
          pwsh make.ps1 dist

          # Stash the zip: the MSIX build below cleans dist/ before its own
          # PyInstaller run, which would otherwise delete the freshly-built zip.
          New-Item -ItemType Directory -Force -Path _stash | Out-Null
          Copy-Item dist/*.zip _stash/ -Force

          # 2) Derive a 4-part numeric MSIX version from __init__.py. The MSIX
          #    manifest's Identity/@Version must be Major.Minor.Build.Revision
          #    with numeric parts only, so a beta like "1.0.0b1" maps to
          #    "1.0.0.0" (the pre-release suffix is dropped for the package id).
          $raw = (Select-String -Path .\__init__.py `
                    -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          # Take the leading dotted-numeric release prefix only, dropping any
          # pre-release suffix (e.g. "1.0.0b1" -> "1.0.0"), then pad to 4 parts.
          $lead = ([regex]::Match($raw, '^\d+(\.\d+)*')).Value
          $nums = [System.Collections.ArrayList]@()
          foreach ($p in $lead.Split('.')) { [void]$nums.Add($p) }
          while ($nums.Count -lt 4) { [void]$nums.Add('0') }
          $msixVer = ($nums[0..3] -join '.')
          Write-Host "MSIX version: $msixVer (from __version__ = $raw)"

          # 3) Build + self-sign the MSIX (build_msix.ps1 finds makeappx/signtool
          #    from the Windows SDK preinstalled on the runner and creates a
          #    self-signed cert + public .cer for side-loading).
          pwsh -ExecutionPolicy Bypass -File build_msix.ps1 -Version $msixVer

          # 4) Collect every release artifact into dist/ so the shared upload +
          #    release steps pick them all up. The .cer lets users trust the
          #    self-signed package before installing.
          Copy-Item _stash/*.zip dist/ -Force
          Copy-Item *.msix dist/ -Force
          if (Test-Path packaging/episodesleuth_selfsign.cer) {
            Copy-Item packaging/episodesleuth_selfsign.cer dist/ -Force
          }
          Write-Host "dist/ contents:"; Get-ChildItem dist/ | Format-Table Name,Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: episodesleuth-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
            dist/*.msix
            dist/*.cer
          if-no-files-found: warn

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
            dist/*.msix
            dist/*.cer
          fail_on_unmatched_files: false
