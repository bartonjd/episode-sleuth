# PEP 517/518 build configuration for EpisodeSleuth.
#
# Project metadata (dependencies, entry points, version) is defined in
# setup.py so that requirements.txt stays the single source of truth for the
# dependency list. This file just declares the build backend and the pytest
# configuration.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
# Match the project's minimum supported interpreter so pyupgrade-style rules do
# not suggest syntax that would break on Python 3.9.
target-version = "py39"
line-length = 100
# Never lint throwaway build venvs, packaging output or vendored code.
extend-exclude = [".buildvenv", "build", "dist", ".git", "__pycache__"]

[tool.ruff.lint]
# A focused, high-signal rule set: pycodestyle errors/warnings (E, W),
# pyflakes (F) and import sorting (I). This catches real problems (unused
# imports, undefined names, unsorted imports) without drowning an existing
# codebase in stylistic churn.
select = ["E", "F", "W", "I"]
# E402 (module import not at top): the flat module layout deliberately performs
# sys.path setup and defensive/optional imports before some imports, so this is
# expected and intentional here.
ignore = ["E402"]

[tool.mypy]
# Type-check the identification engine package. The engine is the reusable
# core, so it is where static typing pays off most. Run with:
#     MYPYPATH=. mypy engine --explicit-package-bases
# (explicit-package-bases avoids the root __init__.py making engine resolve
# under two module names). Imported root modules (fingerprint_core, stt_utils)
# are followed silently so only the engine's own types are enforced here.
files = ["engine"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
no_implicit_optional = true
