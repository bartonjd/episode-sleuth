# PEP 517/518 build configuration for EpisodeSleuth.
#
# Project metadata (dependencies, entry points, version) is defined in
# setup.py so that requirements.txt stays the single source of truth for the
# dependency list. This file just declares the build backend and the pytest
# configuration.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# Type-check the identification engine package. The engine is the reusable
# core, so it is where static typing pays off most. Run with:
#     MYPYPATH=. mypy engine --explicit-package-bases
# (explicit-package-bases avoids the root __init__.py making engine resolve
# under two module names). Imported root modules (fingerprint_core, stt_utils)
# are followed silently so only the engine's own types are enforced here.
files = ["engine"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
no_implicit_optional = true
